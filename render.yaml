# ==============================================================================
# Impact-IQ — Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: impactiq-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # Next.js Frontend Web Service (Optional: If hosting frontend on Render)
  # ----------------------------------------------------------------------------
  - type: web
    name: impactiq-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: impactiq-backend
          property: host
      - key: NEXT_PUBLIC_NHOST_SUBDOMAIN
        value: ieoqkrnezzpfxpsugifg
      - key: NEXT_PUBLIC_NHOST_REGION
        value: ap-south-1
      - key: NEXT_PUBLIC_NHOST_GRAPHQL_URL
        value: https://ieoqkrnezzpfxpsugifg.graphql.ap-south-1.nhost.run/v1/graphql
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
