version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: impactiq-backend-prod
    restart: unless-stopped
    environment:
      - DEBUG=False
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./impact_iq.db}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - impactiq-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
        - NEXT_PUBLIC_NHOST_SUBDOMAIN=${NEXT_PUBLIC_NHOST_SUBDOMAIN:-ieoqkrnezzpfxpsugifg}
        - NEXT_PUBLIC_NHOST_REGION=${NEXT_PUBLIC_NHOST_REGION:-ap-south-1}
        - NEXT_PUBLIC_NHOST_GRAPHQL_URL=${NEXT_PUBLIC_NHOST_GRAPHQL_URL:-https://ieoqkrnezzpfxpsugifg.graphql.ap-south-1.nhost.run/v1/graphql}
    container_name: impactiq-frontend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      - backend
    networks:
      - impactiq-network

  nginx:
    image: nginx:alpine
    container_name: impactiq-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - impactiq-network

networks:
  impactiq-network:
    driver: bridge
